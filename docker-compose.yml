name: wio_nord_bot

services:
  wio_nord_bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - nordmark_data:/app/data

volumes:
  nordmark_data:
    # Volume создан вручную при миграции rootful → rootless (сохранены данные
    # 10 игроков) и живёт под именем wio_nord_bot_nordmark_data. external + name —
    # чтобы компоуз не думал, что том надо создавать заново.
    name: wio_nord_bot_nordmark_data
    external: true

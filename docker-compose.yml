name: wio_nord_bot

services:
  wio_nord_bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - nordmark_data:/app/data

volumes:
  nordmark_data:
    # Volume создан вручную при миграции rootful → rootless (сохранены данные
    # 10 игроков). external: true — чтобы не было предупреждения о пересоздании.
    external: true
